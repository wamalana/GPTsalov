[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "gptsalov"
version = "0.1.1"
description = "Public-data crypto futures research and paper simulation; no real orders"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
gptsalov = "gptsalov.__main__:main"

[tool.setuptools.packages.find]
include = ["gptsalov*"]
